<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal Day 💍</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #ffdde1, #ee9ca7);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
}

.card {
    background: rgba(255,255,255,0.95);
    padding: 25px 20px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.25);
    max-width: 420px;
    width: 90%;
    animation: scaleIn 1s ease;
}

h1 { margin-top: 0; color: #ff5e62; font-weight: 600; }
p { font-size: 17px; color: #444; line-height: 1.6; }
.question { margin: 20px 0; font-size: 22px; font-weight: 600; color: #ff6f61; }

.buttons {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 20px;
    position: relative;
}

button {
    padding: 12px 30px;
    border-radius: 40px;
    border: none;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s ease, transform 0.3s ease, left 0.5s ease, top 0.5s ease;
}

#yesBtn {
    background: linear-gradient(135deg, #ff6f61, #ff9966);
    color: white;
    box-shadow: 0 10px 25px rgba(255,111,97,0.45);
}
#yesBtn:hover { transform: scale(1.15); }

#noBtn {
    background: #eee;
    color: #555;
    position: relative; 
}

.thinking { margin-top: 15px; font-size: 14px; color: #777; min-height: 18px; }

.answer { display: none; animation: fadeUp 1s ease; }
.answer h2 { color: #ff5e62; }

.heart {
    position: absolute;
    bottom: -30px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
}

.proposal-image, .answer-image {
    text-align: center;
    margin: 15px 0;
}

.proposal-image img, .answer-image img {
    max-width: 100%; 
    width: 40%;       
    max-height: 250px;
    height: auto;     
    border-radius: 12px;
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    display: block;
    margin: 0 auto;
}

@keyframes floatUp {
    from { transform: translateY(0) scale(1); opacity:1; }
    to { transform: translateY(-120vh) scale(1.5); opacity:0; }
}

@keyframes scaleIn {
    from { transform: scale(0.6); opacity:0; }
    to { transform: scale(1); opacity:1; }
}

@keyframes fadeUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
</style>
</head>

    <div class="question">Will you marry me?</div>

    <div class="buttons">
        <button id="noBtn">No 😌</button>
        <button id="yesBtn">Yes ❤️</button>
    </div>

    <div class="thinking" id="thinkingText"></div>

<div class="card answer" id="answerCard">
    <h2>Best Decision Ever 💍</h2>
    <p>
        Seri 😍<br>
        appo epa marriage vachukalam 😎💖
    </p>

    <!-- Answer image -->
    <div class="answer-image">
        <img src=".vscode\assets\1000139193.jpg" alt="Happily Together">
    </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const proposalCard = document.getElementById("proposalCard");
const answerCard = document.getElementById("answerCard");

const noMessages = [
    "No lam solla koodathu thangam 😘",
    "mathi button ah click panra papu yes sollu my maan kutty 💓",
    "Neeyum nanum semma jodi so yosichu sollu 😏",
    "Kattikalama namma🥺",
    "Jaanu Mahir yes sollunga amma nu kekanga ❤️"
];

// Smooth floating for No button
let posX = 0, posY = 0;
let dirX = 1, dirY = 1;
const speed = 1.5;
let moveAnim = null;

noBtn.addEventListener("mouseenter", () => {
    const msg = noMessages[Math.floor(Math.random() * noMessages.length)];
    noBtn.textContent = msg;

    const rect = noBtn.getBoundingClientRect();
    posX = rect.left;
    posY = rect.top;
    noBtn.style.position = "fixed";
    
    if (!moveAnim) moveAnim = requestAnimationFrame(floatNo);
});

noBtn.addEventListener("mouseleave", () => {
    noBtn.textContent = "No 😌";
    if (moveAnim) {
        cancelAnimationFrame(moveAnim);
        moveAnim = null;
    }
    noBtn.style.position = "relative";
    noBtn.style.left = "";
    noBtn.style.top = "";
});

function floatNo() {
    const maxX = window.innerWidth - noBtn.offsetWidth;
    const maxY = window.innerHeight - noBtn.offsetHeight;

    if (Math.random() < 0.02) dirX = Math.random() < 0.5 ? -1 : 1;
    if (Math.random() < 0.02) dirY = Math.random() < 0.5 ? -1 : 1;

    posX += dirX * speed;
    posY += dirY * speed;

    if (posX <= 0) { posX = 0; dirX = 1; }
    if (posX >= maxX) { posX = maxX; dirX = -1; }
    if (posY <= 0) { posY = 0; dirY = 1; }
    if (posY >= maxY) { posY = maxY; dirY = -1; }

    noBtn.style.left = posX + "px";
    noBtn.style.top = posY + "px";

    moveAnim = requestAnimationFrame(floatNo);
}

yesBtn.addEventListener("click", () => {
    proposalCard.style.display = "none";
    answerCard.style.display = "block";
    startHearts();
});

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 20 + 16 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }, 350);
}
</script>
